# Builds the site and publishes it to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Until then the deploy job fails harmlessly.
#
# The site is built in owner-preview mode (preview bar, "Proposed" tags,
# noindex). Set NEXT_PUBLIC_DEMO_MODE to "false" below only after the owners
# have approved the content.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch is published.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_DEMO_MODE: "true"
          # e.g. "/Barneys-place-" — taken from GitHub so a repository rename keeps working.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
